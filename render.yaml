services:
  - type: web
    name: paro-public
    runtime: python
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn paro.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PARO_DATABASE_URL
        sync: false
      - key: PARO_API_KEY
        sync: false
      - key: PARO_TRUSTED_INGEST_TOKEN
        sync: false
      - key: PARO_ENV
        value: production
  - type: cron
    name: paro-live-demo-feed
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install uv && uv sync --frozen --extra simulator --no-dev
    startCommand: uv run python -m scripts.run_live_demo
    envVars:
      - key: PARO_DATABASE_URL
        sync: false
      - key: PARO_BASE_URL
        value: https://paro-public.onrender.com
      - key: PARO_API_KEY
        sync: false
      - key: PARO_TRUSTED_INGEST_TOKEN
        sync: false
      - key: PARO_ENV
        value: production
