# CI de PARO.
#
# `quality` corre lint, tipos y la suite completa sobre SQLite (el pivote
# temporal del ADR 0002). `integration-postgres` corre solo las pruebas de
# integracion contra un PostgreSQL real de servicio: es el criterio de salida
# del ADR 0002 y el que decide si lo que hoy afirmamos sobre constraints,
# transacciones y tipos se sostiene fuera de SQLite. Ver ADR 0003.
#
# El job `changes` decide, segun los paths modificados, cuales de los demas
# jobs corren: `quality`/`integration-postgres` solo si cambio codigo/deps
# relevantes, `alembic-dry-run` solo si cambio `alembic/`, y
# `powerbi-validate` si cambia cualquier fuente bajo `PowerBi/`, incluido TMDL.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      alembic: ${{ steps.filter.outputs.alembic }}
      powerbi: ${{ steps.filter.outputs.powerbi }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'alembic/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            alembic:
              - 'alembic/**'
            powerbi:
              - 'PowerBi/**'

  quality:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff (lint)
        run: uv run ruff check src tests alembic scripts

      - name: Ruff (format)
        run: uv run ruff format --check src tests alembic scripts

      - name: Mypy
        run: uv run mypy src alembic tests scripts

      - name: Pytest
        run: uv run pytest -v

  integration-postgres:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # El riesgo de rendimiento (downgrade+upgrade por prueba) esta anotado como
    # no bloqueante en ADR 0003; este limite solo evita un job colgado.
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        # Credenciales fijas a proposito: este servicio es efimero, vive solo
        # dentro del job y no es alcanzable desde fuera. No son secretos y no
        # deben moverse a `secrets`.
        env:
          POSTGRES_USER: paro
          POSTGRES_PASSWORD: paro
          POSTGRES_DB: paro_test
        ports:
          - 5432:5432
        # Sin el health-check el job arranca antes de que Postgres acepte
        # conexiones y `alembic` falla de forma intermitente.
        options: >-
          --health-cmd "pg_isready -U paro -d paro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # `+psycopg` es obligatorio: SQLAlchemy resuelve `postgresql://` a
      # psycopg2, que no esta instalado (pyproject trae psycopg 3).
      PARO_TEST_POSTGRES_URL: postgresql+psycopg://paro:paro@localhost:5432/paro_test

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # Solo `tests/integration`: es la unica suite que usa `migrated_engine`.
      # Las unitarias son dominio puro y ya corren en `quality`.
      - name: Pytest (integracion sobre PostgreSQL)
        run: uv run pytest tests/integration -v

  alembic-dry-run:
    needs: changes
    if: needs.changes.outputs.alembic == 'true'
    runs-on: ubuntu-latest
    env:
      # No necesita ser alcanzable: `alembic upgrade head --sql` corre en modo
      # offline (`context.is_offline_mode()`), nunca abre una conexion real.
      # El dialecto postgresql+psycopg si importa: sin esto, `PARO_DATABASE_URL`
      # caeria al default de SQLite y el SQL generado no seria el correcto.
      PARO_DATABASE_URL: postgresql+psycopg://paro:paro@localhost:5432/paro_dry_run
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Alembic dry-run (SQL offline, sin conexion a base de datos)
        run: uv run alembic upgrade head --sql

  powerbi-validate:
    needs: changes
    if: needs.changes.outputs.powerbi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Validar JSON de PowerBi
        run: python scripts/validate_powerbi.py
